# This integration test ci job is used to test the DB alterations compatibility with the current codebase.

name: Alteration compatibility integration test
on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check-alteration-changes:
    runs-on: ubuntu-latest
    outputs:
      has-alteration-changes: ${{ steps.changes-detection.outputs.has-alteration-changes }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # compare the current codebase with HEAD and check if there are any changes under the alterations folder
      # if the event is a pull request, we need to compare the merge base with HEAD, otherwise we compare the current commit with the previous commit
      - name: Check for alteration changes
        id: changes-detection
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE=$(git merge-base origin/${{ github.base_ref }} HEAD)
          else
            BASE=${{ github.event.before }}
          fi

          CHANGE_FILES=$(git diff --name-only $BASE | grep 'packages/schemas/alterations/' || true)

          if [ -n "$CHANGE_FILES" ]; then
            echo "$CHANGE_FILES"
            echo "has-alteration-changes=true" >> $GITHUB_OUTPUT
            echo "Alteration changes detected"
          else
            echo "has-alteration-changes=false" >> $GITHUB_OUTPUT
            echo "No alteration changes detected"
          fi

  package:
    needs: check-alteration-changes
    runs-on: ubuntu-latest
    if: ${{ needs.check-alteration-changes.outputs.has-alteration-changes == 'true' }}
    env:
      INTEGRATION_TEST: true
      DEV_FEATURES_ENABLED: false
      # Console's Vite build exceeds Node's default heap ceiling on hosted runners.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      # Inlined from logto-io/actions-package-logto-artifact: the action's own checkout does not
      # populate git submodules, so `pnpm i` fails on the ubill-sms lockfile importer.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          submodules: true

      - name: Setup Node and pnpm
        uses: silverhand-io/actions-node-pnpm-run-steps@v5
        with:
          pnpm-version: 12.10.1
          node-version: ^26.0.0

      - name: Build and package
        run: |
          # package.sh's `pnpm cli connector link` trips pnpm 12's verify-deps-before-run on the
          # production-pruned workspace (reinstall can't resolve @logto/cli@workspace:^).
          pnpm config set verify-deps-before-run false
          pnpm -r build
          ./.scripts/package.sh

      - name: Upload Logto artifact
        uses: actions/upload-artifact@v4
        with:
          name: alteration-integration-test-${{ github.sha }}
          path: /tmp/logto.tar.gz
          retention-days: 3

  run-logto:
    strategy:
      fail-fast: false
      matrix:
        target: [api, experience, console]
    needs: package
    # An error will occur if we use a newer version of Ubuntu in the CI environment, as it has restrictions on unprivileged user namespaces and sandbox usage, which prevents Chromium (used by Puppeteer) from launching properly during integration tests. So we lock the Ubuntu version to 22.04.
    # See error record: https://github.com/logto-io/logto/actions/runs/12803809008/job/35697654974
    runs-on: ubuntu-22.04
    env:
      INTEGRATION_TEST: true
      DEV_FEATURES_ENABLED: false
      # Mock servers for backchannel logout and webhook delivery listen on loopback, which the SSRF
      # protection blocks. Allow just those addresses instead of disabling the protection. CIMD
      # cannot be enabled while an allowlist is set.
      SSRF_ALLOWED_ADDRESSES: 127.0.0.0/8,::1
      # Key encryption key (KEK) for the secret vault used in integration tests
      SECRET_VAULT_KEK: DtPWS09unRXGuRScB60qXqCSsrjd22dUlXt/0oZgxSo=
      DB_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Mock key for authorized status API access during integration tests
      STATUS_API_KEY: test-status-api-key
      # The public half of the fixture ES256 key pair the self-hosted license tests sign with, so
      # the instance under test can install a license. See
      # `packages/integration-tests/src/helpers/license.ts`; honored outside production and during
      # integration tests.
      SELF_HOSTED_LICENSE_PUBLIC_KEY: '{"kty":"EC","crv":"P-256","x":"r79NM6kQhcFX7GZwo6gh0qGMYapn3XkwwkcdW-EWXC4","y":"XElMflsuc4fEc3iUJc-LLuVpaAWfqm-vZEb_JzZEOi8"}'


    steps:
      # The action's internal `tests/` checkout does not populate git submodules, so its inner
      # `pnpm i` drops the ubill-sms importer via frozenLockfile=false in pnpm-workspace.yaml
      # (the only location pnpm 12 honors for it).
      - uses: logto-io/actions-run-logto-integration-tests@2a25b5849c693cabd79dd5613de218a995fe0f6d
        with:
          branch: ${{ github.base_ref }}
          logto-artifact: alteration-integration-test-${{ github.sha }}
          test-target: ${{ matrix.target }}
          db-alteration-target: ${{ github.head_ref }}
          db-alteration-repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          pnpm-version: 12.10.1
          node-version: ^26.0.0

  # Automatically rerun the workflow since the integration tests are moody
  # From this genius: https://github.com/orgs/community/discussions/67654#discussioncomment-8038649
  rerun-on-failure:
    needs: run-logto
    if: failure() && fromJSON(github.run_attempt) < 3
    # An error will occur if we use a newer version of Ubuntu in the CI environment, as it has restrictions on unprivileged user namespaces and sandbox usage, which prevents Chromium (used by Puppeteer) from launching properly during integration tests. So we lock the Ubuntu version to 22.04.
    # See error record: https://github.com/logto-io/logto/actions/runs/12803809008/job/35697654974
    runs-on: ubuntu-22.04
    steps:
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          GH_DEBUG: api
        run: gh workflow run rerun.yml -F run_id=${{ github.run_id }}

  alteration-compatibility-conclusion:
    needs: run-logto
    runs-on: ubuntu-latest
    if: always() && (needs.run-logto.result == 'success' || needs.run-logto.result == 'skipped')
    steps:
      - name: Conclusion
        run: echo "Alteration compatibility integration test completed successfully"
