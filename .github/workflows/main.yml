name: Main

on:
  push:
    branches:
      - master
      - "push-action/**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Console's Vite build exceeds Node's default heap ceiling on hosted runners
  # (fails ~1.7 GB with "JavaScript heap out of memory"); raise the ceiling for
  # every Node process in all jobs.
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  main-generated-files:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        # Populate git submodules (connector-ubill-sms); `pnpm i` runs devPreinstall which
        # needs the submodule files present.
        with:
          submodules: true

      - name: Setup Node and pnpm
        uses: silverhand-io/actions-node-pnpm-run-steps@v5
        with:
          pnpm-version: 12.10.1
          node-version: ^22.14.0

      - name: Sync connector presets
        run: pnpm run pnpm:devPreinstall

      - name: Check connector generated files
        run: |
          # The ubill-sms submodule's preset-synced files live in its own repo; sync-preset
          # rewrites them on every install, so its gitlink always shows dirty. Scope the
          # check to tracked connector sources.
          if ! git diff --exit-code -- packages/connectors ':(exclude)packages/connectors/connector-ubill-sms'; then
            echo "Connector package presets are out of sync. Run 'pnpm run pnpm:devPreinstall' and commit the changes."
            exit 1
          fi

  main-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        # Populate git submodules (connector-ubill-sms); `pnpm i` runs devPreinstall which
        # needs the submodule files present.
        with:
          submodules: true

      - name: Setup Node and pnpm
        uses: silverhand-io/actions-node-pnpm-run-steps@v5
        with:
          pnpm-version: 12.10.1
          node-version: ^22.14.0

      - name: Build
        run: pnpm ci:build

  main-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        # Populate git submodules (connector-ubill-sms); `pnpm i` runs devPreinstall which
        # needs the submodule files present.
        with:
          submodules: true

      - name: Setup Node and pnpm
        uses: silverhand-io/actions-node-pnpm-run-steps@v5
        with:
          pnpm-version: 12.10.1
          node-version: ^22.14.0

      - name: Prepack
        run: pnpm prepack

      - name: Check
        run: pnpm -r check

  main-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        # Populate git submodules (connector-ubill-sms); `pnpm i` runs devPreinstall which
        # needs the submodule files present.
        with:
          submodules: true

      - name: Setup Node and pnpm
        uses: silverhand-io/actions-node-pnpm-run-steps@v5
        with:
          pnpm-version: 12.10.1
          node-version: ^22.14.0

      - name: Prepack
        run: pnpm prepack

      - name: Lint
        run: pnpm ci:lint

      - name: Stylelint
        run: pnpm ci:stylelint

  main-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        # Populate git submodules (connector-ubill-sms); `pnpm i` runs devPreinstall which
        # needs the submodule files present.
        with:
          submodules: true

      - name: Setup Node and pnpm
        uses: silverhand-io/actions-node-pnpm-run-steps@v5
        with:
          pnpm-version: 12.10.1
          node-version: ^22.14.0

      - name: Build for test
        run: pnpm -r build:test

      - name: Install playwright for element tests
        working-directory: ./packages/elements
        run: pnpm exec playwright install --with-deps

      - name: Test
        run: pnpm ci:test

      - name: Codecov core
        uses: codecov/codecov-action@v4
        with:
          flags: core
          directory: ./packages/core
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Codecov ui
        uses: codecov/codecov-action@v4
        with:
          flags: ui
          directory: ./packages/ui
          token: ${{ secrets.CODECOV_TOKEN }}

  main-dockerize:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Populate git submodules so the ubill connector is in the Docker build context.
          fetch-depth: 0
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: | # Test cloud build
            additional_connector_args=--cloud

  main-alteration:
    runs-on: ubuntu-latest

    steps:
      # ** Checkout fresh and alteration ref **
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: ./fresh
          # Populate git submodules; `pnpm i` runs devPreinstall which needs them present.
          submodules: true

      # Fetch the current version by finding the latest tag starts with "v", e.g. "v1.0.0-beta.19"
      - id: version
        working-directory: ./fresh
        run: echo "current=$(git describe --match "@logto/core@*" --abbrev=0)" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.current }}
          path: ./alteration
      # ** End **

      - name: Copy lockfile # Make setup workflow happy
        run: cp ./fresh/pnpm-lock.yaml ./

      - name: Setup Node and pnpm
        uses: silverhand-io/actions-node-pnpm-run-steps@v5
        with:
          pnpm-version: 12.10.1
          node-version: ^22.14.0
          run-install: false

      # ** Prepack packages **
      - name: Prepack fresh
        working-directory: ./fresh
        run: pnpm i && pnpm prepack

      - name: Prepack alteration
        working-directory: ./alteration
        # The pinned release tag predates the pnpm 12 migration (`engines.pnpm` is ^9||^10 and
        # its overrides live in package.json's `pnpm` field, which pnpm 12 ignores) — install
        # and build it under pnpm 10 instead of the workspace's pnpm 12.
        run: npx -y pnpm@10.18.2 i && npx -y pnpm@10.18.2 prepack
      # ** End **

      - name: Setup Postgres
        uses: ikalnytskyi/action-setup-postgres@v6

      # ** Setup up-to-date databases and compare (test `up`) **
      - name: Setup fresh database
        working-directory: ./fresh
        run: pnpm cli db seed --test
        env:
          DB_URL: postgres://postgres:postgres@localhost:5432/fresh

      - name: Setup alteration database
        working-directory: ./alteration
        run: |
          cd packages/cli
          pnpm start db seed --test
        env:
          DB_URL: postgres://postgres:postgres@localhost:5432/alteration

      - name: Run alteration scripts
        working-directory: ./fresh
        run: pnpm cli db alt deploy next
        env:
          ALTERATION_TEST: true
          DB_URL: postgres://postgres:postgres@localhost:5432/alteration

      - name: Compare databases
        working-directory: ./fresh
        run: node .scripts/compare-database.js fresh alteration
      # ** End **

      # ** Setup old databases and compare (test `down`) **
      - name: Setup old database
        working-directory: ./alteration
        run: |
          cd packages/cli
          pnpm start db seed --test
        env:
          DB_URL: postgres://postgres:postgres@localhost:5432/old

      - name: Revert fresh database to old
        working-directory: ./fresh
        run: pnpm cli db alt r v$(echo ${{ steps.version.outputs.current }} | cut -d@ -f3)
        env:
          ALTERATION_TEST: true
          DB_URL: postgres://postgres:postgres@localhost:5432/fresh

      - name: Compare manifests
        working-directory: ./fresh
        run: node .scripts/compare-database.js fresh old
      # ** End **

      - name: Check alteration sequence
        working-directory: ./fresh
        run: node .scripts/check-alterations-sequence.js
